name: MediAcad Automated CI Pipeline

on:
  push:
    branches:
      - main
      - member1-ingestion
      - member2-retrieval
      - member3-agent
      - member4-eval-ui
  pull_request:
    branches:
      - main

jobs:
  verify-architecture-and-tests:
    name: Python 3.11 OOP & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Core Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic

      - name: Check Python Syntax Across All Packages
        run: |
          python -m compileall src tests

      - name: Run Automated Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v